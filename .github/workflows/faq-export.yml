# Save this file in the repo as:  .github/workflows/faq-export.yml
# It runs faq_export.py on GitHub's servers and commits the result to the repo.
name: FAQ export

on:
  schedule:
    - cron: "0 5 * * 1"          # every Monday at 05:00 UTC
  workflow_dispatch:              # adds a "Run workflow" button on the Actions tab
    inputs:
      limit:
        description: "Trial run: only the first N FAQs per language (0 = all)"
        default: "0"

permissions:
  contents: write                 # lets the job commit the exported files

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install requests beautifulsoup4 markdownify

      - name: Export FAQs
        id: export
        continue-on-error: true   # still commit what was fetched if some pages failed
        run: python faq_export.py --out . --limit "${{ inputs.limit || 0 }}"

      - name: Commit result
        run: |
          git config user.name "faq-export"
          git config user.email "faq-export@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "FAQ export $(date -u +%F)"
          git push

      - name: Mark the run as failed if the export had problems
        if: steps.export.outcome == 'failure'
        run: |
          echo "Some FAQs failed, were blocked, or came out thin. See EXPORT.json."
          exit 1
